name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest -v test_codex_usage_overlay.py

      - name: Compile check
        run: python -m py_compile codex_usage_overlay.pyw test_codex_usage_overlay.py
